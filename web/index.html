<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Self-test Agent</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Agent 状态与快捷操作">
      <header class="brand">
        <div class="mark" aria-hidden="true">SA</div>
        <div>
          <h1>Self-test Agent</h1>
          <p>本地工具调用与计划执行实验台</p>
        </div>
      </header>

      <section class="panel">
        <div class="panel-title">
          <span>运行状态</span>
          <span id="serverStatus" class="status-pill">检测中</span>
        </div>
        <div class="metric-row"><span>模式</span><strong>Agent Loop</strong></div>
        <div class="metric-row"><span>工作区</span><strong>self-test</strong></div>
        <div class="metric-row"><span>工具轨迹</span><strong id="traceCount">0 次</strong></div>
      </section>

      <section class="panel">
        <div class="panel-title">
          <span>执行资源</span>
          <span id="resourceSummary">检测中</span>
        </div>
        <div id="resourceList" class="resource-list" aria-live="polite"></div>
      </section>

      <section class="panel">
        <div class="panel-title">
          <span>常用指令</span>
        </div>
        <div class="quick-grid">
          <button class="quick" type="button" data-text="get workspace summary">工作区摘要</button>
          <button class="quick" type="button" data-text="plans">查看计划</button>
          <button class="quick" type="button" data-text="count python files">统计 Python</button>
          <button class="quick" type="button" data-text="show first 5 lines of README.md">预览 README</button>
        </div>
      </section>

      <section class="panel">
        <div class="panel-title">
          <span>验证方向</span>
        </div>
        <ul class="check-list">
          <li>工具选择</li>
          <li>参数校验</li>
          <li>权限与审批</li>
          <li>计划执行与结果写回</li>
        </ul>
      </section>

      <button id="resetBtn" class="ghost-button" type="button">重置对话</button>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div>
          <p class="eyebrow">Agent Conversation</p>
          <h2>对话与工具执行</h2>
        </div>
        <div class="topbar-actions" aria-label="当前能力">
          <span>本地验证</span>
          <span>工具调用</span>
          <span>计划状态</span>
        </div>
      </header>

      <section id="chatLog" class="chat-log" aria-live="polite"></section>

      <form id="chatForm" class="composer">
        <div class="input-wrap">
          <textarea
            id="messageInput"
            rows="2"
            placeholder="输入自然语言指令，例如：execute next step of plan_xxx"
            aria-label="发送给 Agent 的消息"
          ></textarea>
          <div class="composer-hint">Ctrl + Enter 发送</div>
        </div>
        <button id="sendBtn" type="submit" disabled>发送</button>
      </form>
    </main>

    <aside class="trace-panel" aria-label="工具调用轨迹">
      <header class="trace-header">
        <div>
          <p class="eyebrow">Tool Trace</p>
          <h2>工具调用</h2>
        </div>
      </header>
      <div id="traceLog" class="trace-log"></div>
    </aside>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
